# Puerto dinamico para la nube
server.port=${PORT:8080}

spring.application.name=backend-app

# Conexion a Base de Datos (Neon/MySQL)
spring.datasource.url = ${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}


# Llave JWT Segura
jwt.secret=${JWT_SECRET_KEY}

# La magia de Hibernate: Crea las tablas automaticamente si no existen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 1. Conexion a Groq AI
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.1-8b-instant

